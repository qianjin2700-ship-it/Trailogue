openapi: 3.0.3
info:
  title: Trailogue API
  version: 1.0.0
  description: Phase B authenticated API for the Trailogue iOS client.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { description: Process is healthy }
  /ready:
    get:
      operationId: ready
      responses:
        '200': { description: PostgreSQL is reachable }
        '503': { $ref: '#/components/responses/InternalError' }
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      description: Verifies an Apple identity token and creates a Trailogue bearer session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppleSignInRequest' }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidAppleToken' }
  /v1/users/me:
    get:
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateCurrentUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserSettingsRequest' }
      responses:
        '200': { description: Updated user settings }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteCurrentUser
      description: Permanently deletes private objects followed by the user and cascading records.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties: { confirmation: { type: string, enum: [DELETE] } }
      responses:
        '200': { description: Account deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/trips:
    post:
      operationId: createTrip
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTripRequest' }
      responses:
        '201':
          description: Owner-scoped draft trip created or returned for the same idempotency key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Trip' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listTrips
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Owner-scoped trip page ordered by most recently updated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Trip' }
                  meta:
                    type: object
                    required: [nextCursor]
                    properties:
                      nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/trips/{id}:
    get:
      operationId: getTrip
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owner-scoped trip detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTrip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTripRequest' }
      responses:
        '200': { description: Updated owner-scoped trip }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTrip
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Trip, related records, and private photo objects deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trips/{id}/cover:
    put:
      operationId: setTripCover
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoId]
              properties: { photoId: { type: string, format: uuid, nullable: true } }
      responses:
        '200': { description: Owned ready photo selected as cover }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trips/{tripId}/photos/uploads:
    post:
      operationId: createPhotoUpload
      description: Creates or refreshes an idempotent upload intent for an owned trip.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePhotoUploadRequest' }
      responses:
        '201':
          description: Pending photo and short-lived R2 PUT URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/PhotoUploadIntent' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/trips/{tripId}/photos/{photoId}/complete:
    post:
      operationId: completePhotoUpload
      description: Verifies the R2 object metadata and marks the photo ready.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Verified ready photo with a short-lived read URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Photo' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/trips/{tripId}/photos:
    get:
      operationId: listTripPhotos
      description: Lists only verified ready photos for an owned trip.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ready photos with short-lived read URLs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Photo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trips/{tripId}/photos/order:
    put:
      operationId: reorderTripPhotos
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoIds]
              properties:
                photoIds: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
      responses:
        '200': { description: Photo order saved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trips/{tripId}/photos/{photoId}:
    patch:
      operationId: updateTripPhoto
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Photo facts updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteTripPhoto
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Photo and private object deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/trips/{tripId}/story/generate:
    post:
      operationId: generateTripStory
      description: Performs real DeepSeek photo understanding when the configured or fallback model advertises image input, then persists a new story version.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Generated story version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/trips/{tripId}/story:
    get:
      operationId: getLatestTripStory
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Latest story version }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveEditedTripStory
      description: Persists edits as a new immutable story version.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Edited story version }
  /v1/trips/{tripId}/stories:
    get:
      operationId: listTripStoryVersions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Immutable story versions ordered newest first }
  /v1/trips/{tripId}/book:
    get:
      operationId: getBookPreview
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Persisted book layout and latest story }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trips/{tripId}/shares:
    post:
      operationId: createPrivateShare
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Private 30-day share URL; only its SHA-256 hash is stored }
  /v1/shares/{shareId}:
    delete:
      operationId: revokePrivateShare
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Share link revoked for its owner }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/shared/{token}:
    get:
      operationId: getSharedStory
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, minLength: 43, maxLength: 43 } }
      responses:
        '200': { description: Shared story with fresh short-lived photo URLs }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AppleSignInRequest:
      type: object
      additionalProperties: false
      required: [identityToken, nonce, profile]
      properties:
        identityToken: { type: string, minLength: 1, maxLength: 16384 }
        authorizationCode: { type: string, nullable: true, maxLength: 4096 }
        nonce: { type: string, minLength: 16, maxLength: 256 }
        profile:
          type: object
          additionalProperties: false
          required: [givenName, familyName, email]
          properties:
            givenName: { type: string, nullable: true, maxLength: 160 }
            familyName: { type: string, nullable: true, maxLength: 160 }
            email: { type: string, nullable: true, maxLength: 320 }
    AuthSession:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, displayName, avatarUrl, email, privacyAgreedAt, retentionDays, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        email: { type: string, nullable: true }
        privacyAgreedAt: { type: string, format: date-time, nullable: true }
        retentionDays: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, nullable: true, maxLength: 160 }
        retentionDays: { type: integer, minimum: -1, maximum: 3650 }
        privacyAgreed: { type: boolean }
    Trip:
      type: object
      required: [id, title, description, destinationName, status, coverPhotoId, photoCount, startDate, endDate, storyBackground, peopleNotes, highlights, writingStyle, customWritingStyle, avoidExpressions, contentLength, arrangement, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        destinationName: { type: string, nullable: true }
        status: { type: string, enum: [draft, published, archived] }
        coverPhotoId: { type: string, format: uuid, nullable: true }
        photoCount: { type: integer, minimum: 0 }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        storyBackground: { type: string, nullable: true }
        peopleNotes: { type: string, nullable: true }
        highlights: { type: string, nullable: true }
        writingStyle: { type: string, enum: [warm_documentary, literary, playful, concise, custom] }
        customWritingStyle: { type: string, nullable: true }
        avoidExpressions: { type: string, nullable: true }
        contentLength: { type: string, enum: [short, medium, long] }
        arrangement: { type: string, enum: [timeline, thematic] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [title, destinationName, startDate, endDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        destinationName: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, nullable: true, maxLength: 10000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    UpdateTripRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        destinationName: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, nullable: true, maxLength: 10000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        storyBackground: { type: string, nullable: true, maxLength: 10000 }
        peopleNotes: { type: string, nullable: true, maxLength: 5000 }
        highlights: { type: string, nullable: true, maxLength: 5000 }
        writingStyle: { type: string, enum: [warm_documentary, literary, playful, concise, custom] }
        customWritingStyle: { type: string, nullable: true, maxLength: 1000 }
        avoidExpressions: { type: string, nullable: true, maxLength: 1000 }
        contentLength: { type: string, enum: [short, medium, long] }
        arrangement: { type: string, enum: [timeline, thematic] }
    CreatePhotoUploadRequest:
      type: object
      additionalProperties: false
      required: [clientUploadId, originalFilename, mimeType, fileSize, width, height]
      properties:
        clientUploadId: { type: string, format: uuid }
        originalFilename: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string, enum: [image/jpeg, image/png] }
        fileSize: { type: integer, minimum: 1, maximum: 15728640 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        capturedAt: { type: string, format: date-time, nullable: true }
    PhotoUploadIntent:
      type: object
      required: [photoId, uploadUrl, method, headers, expiresAt, maxBytes, allowedMimeTypes]
      properties:
        photoId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          required: [Content-Type]
          properties: { Content-Type: { type: string, enum: [image/jpeg, image/png] } }
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer, minimum: 1 }
        allowedMimeTypes:
          type: array
          items: { type: string, enum: [image/jpeg, image/png] }
    Photo:
      type: object
      required: [id, tripId, status, url, originalFilename, mimeType, fileSize, width, height, capturedAt, createdAt, uploadedAt, caption, locationName]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        status: { type: string, enum: [ready] }
        url: { type: string, format: uri }
        originalFilename: { type: string }
        mimeType: { type: string, enum: [image/jpeg, image/png] }
        fileSize: { type: integer, minimum: 1 }
        width: { type: integer, nullable: true, minimum: 1 }
        height: { type: integer, nullable: true, minimum: 1 }
        capturedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        uploadedAt: { type: string, format: date-time, nullable: true }
        caption: { type: string, nullable: true }
        locationName: { type: string, nullable: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidAppleToken:
      description: Apple identity token is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: A valid active Trailogue bearer session is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The owner-scoped resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Upload state or verified object metadata conflicts with the intent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: A required dependency is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
