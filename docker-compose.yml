services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trailogue}
      POSTGRES_USER: ${POSTGRES_USER:-trailogue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailogue_local}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trailogue} -d ${POSTGRES_DB:-trailogue}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - trailogue-postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: trailogue_test
      POSTGRES_USER: trailogue_test
      POSTGRES_PASSWORD: trailogue_test_local
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailogue_test -d trailogue_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trailogue-postgres:
